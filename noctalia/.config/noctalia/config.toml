[dock]
shadow = false

[bar.default]
shadow = false
contact_shadow = false
capsule = true
end = ["group:g1", "clipboard", "group:g3", "group:g4", "battery", "group:g5"]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = ["group:g2", "workspaces"]

[[bar.default.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g2"
members = ["date", "cpu", "ram", "temp"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g1"
members = ["tray", "notifications"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g3"
members = ["network", "bluetooth"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g4"
members = ["volume", "brightness"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g5"
members = ["control-center", "session", "recorder"]
opacity = 1.0
padding = 6.0

[calendar]
enabled = true

[control_center]
width = 600

[location]
address = "Kuala Lumpur, Malaysia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 1280.0
cy = 1258.0
output = "HDMI-A-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = ["gambled23/mangowm-keymode", "noctalia/screen_recorder"]

[shell]
font_family = "Monaspace Argon NF Medium"

[shell.panel]
shadow = false
control_center_placement = "floating"
control_center_position = "center"
session_placement = "floating"
session_position = "center"

[shell.session]
grid = true

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "l"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "r"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "s"
variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["btop", "ghostty", "mango"]

[wallpaper]
directory = "/home/tjtoo04/Wallpapers"
fill_mode = "fit"

[wallpaper.default]
path = "/home/tjtoo04/Wallpapers/wallhaven_9o8k9w.jpg"

[wallpaper.last]
path = "/home/tjtoo04/Wallpapers/wallhaven_9o8k9w.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/tjtoo04/Wallpapers/wallhaven_9o8k9w.jpg"

[wallpaper.monitors.eDP-2]
path = "/home/tjtoo04/Wallpapers/wallhaven_9o8k9w.jpg"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/tjtoo04/Wallpapers/wallhaven_9o8k9w.jpg"
theme_mode = "dark"
wallpaper_scheme = "m3-content"

[[wallpaper.favorite]]
path = "/home/tjtoo04/Wallpapers/gameboy.png"
theme_mode = "auto"

[widget.cpu]
show_label = false

[widget.network]
show_label = false

[widget.ram]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.temp]
show_label = false

[widget.tray]
drawer = true

[widget.workspaces]
active_pill_size = 1.5
